name: Daily Run

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass the already-posted-today guard (testing only)'
        type: boolean
        default: false

concurrency:
  group: daily-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-routine-daily
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-routine-daily/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-routine-daily/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release --all-features

  run:
    needs: build
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-routine-daily
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-routine-daily/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-routine-daily/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          BIRTH_YEAR: ${{ secrets.BIRTH_YEAR }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          LEETCODE_ENDPOINT: https://leetcode.com/graphql/
          LEETCODE_VARIANT: com
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE_FLAG="--force"; fi
          cargo run --release --all-features -- --post --telegram --discord $FORCE_FLAG

      - name: Persist used problems
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet -- data/used_problems.txt; then
            echo "used_problems.txt unchanged"
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/used_problems.txt
          git commit -m "chore: persist used problems [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" || { git rebase --abort; exit 1; }
            git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
